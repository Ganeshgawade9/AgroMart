<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  <g transform="translate(10, 15)">
    <!-- Cart wheels -->
    <circle cx="65" cy="148" r="9" fill="#1F2937"/>
    <circle cx="65" cy="148" r="4" fill="#9CA3AF"/>
    <circle cx="125" cy="148" r="9" fill="#1F2937"/>
    <circle cx="125" cy="148" r="4" fill="#9CA3AF"/>
    
    <!-- Cart frame -->
    <path d="M 22 36 L 42 36 L 60 116 L 138 116 L 152 54 L 46 54" fill="none" stroke="#374151" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 60 116 L 54 136 L 135 136" fill="none" stroke="#374151" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Wire mesh -->
    <line x1="72" y1="56" x2="78" y2="114" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="97" y1="56" x2="100" y2="114" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="122" y1="56" x2="120" y2="114" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="52" y1="74" x2="147" y2="74" stroke="#9CA3AF" stroke-width="2.5"/>
    <line x1="56" y1="94" x2="142" y2="94" stroke="#9CA3AF" stroke-width="2.5"/>
    
    <!-- Bold Red % Discount Badge in the basket -->
    <g transform="translate(100, 62) rotate(-8)" filter="url(#shadow)">
      <circle cx="0" cy="0" r="38" fill="#DC2626"/>
      <circle cx="0" cy="0" r="34" fill="#EF4444"/>
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" text-anchor="middle">%</text>
    </g>
  </g>
</svg>
